# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Status bar
set -g status-position top

# Status bar layout
set -g status-left-length 30
set -g status-right-length 40

set -g status-left " #S "
set -g window-status-format " #I: #W "
set -g window-status-current-format " [#I: #W] "
set -g status-right " %Y-%m-%d %H:%M "

# Gruvbox Dark colors
set -g status-style "bg=default,fg=#a89984"
set -g status-left-style "fg=#fabd2f,bold"
set -g status-right-style "fg=#a89984"

set -g window-status-style "fg=#a89984"
set -g window-status-current-style "fg=#fabd2f,bold"

set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#fabd2f"

# Vim-style pane navigation
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Pane splitting
bind b split-window -h
bind d split-window -v

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# Window management
bind n new-window
bind q confirm-before -p "Kill window #W? (y/n)" kill-window

# Window numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Window naming
set -g automatic-rename off

# Session management
bind x detach-client

# History
set -g history-limit 10000

# Mouse support
set -g mouse on

# Vim-style copy mode
setw -g mode-keys vi

# System clipboard integration (Wayland)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
