# Reload konfiguracji
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Status Bar
# Pozycja i układ
set -g status on
set -g status-position top
set -g status-justify absolute-centre

# Ogólny wygląd - przezroczyste tło
set -g status-style "bg=#3c3836,fg=#a89984"

# Miejsce dla Lualine
set -g status-left-length 99
set -g status-right-length 99

# Lewa strona - nazwa sesji (poza Neovimem)
set -g status-left " #S "
set -g status-left-style "fg=#83a598,bg=#3c3836,bold"

# Prawa strona - data i godzina (poza Neovimem)
set -g status-right " %Y-%m-%d %H:%M "
set -g status-right-style "fg=#a89984,bg=#3c3836"

# Lista okien - tło Lualine C
set -g window-status-format " #I: #W "
set -g window-status-style "fg=#a89984,bg=#3c3836"

# Aktywne okno - kolor tymczasowy
set -g window-status-current-format " #I: #W "
set -g window-status-current-style "fg=#83a598,bg=#3c3836,bold"


# Obsluga stylizowanych podkreslen
set -as terminal-features ",xterm*:usstyle"

# Przekazywanie zdarzen zmiany fokusu do aplikacji
set -g focus-events on

# Pane splitting
bind b split-window -h
bind d split-window -v

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# Window management
bind c new-window
bind q confirm-before -p "Kill window #W? (y/n)" kill-window

# Window numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Window naming
set -g automatic-rename off

# Session management
bind x detach-client

# History
set -g history-limit 10000

# Mouse support
set -g mouse on

# Vim-style copy mode
setw -g mode-keys vi

# System clipboard integration (Wayland)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# FZF - przezroczyste tło
set-environment -g FZF_DEFAULT_OPTS '--color=bg:-1,bg+:-1'

# Popup - przezroczyste tło
set -g popup-style 'bg=default,fg=#ebdbb2'

# TMP - Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind 't'
set -g @floax-border-color '#665c54'
set -g @floax-text-color '#ebdbb2'
set -g @floax-title ' terminal '
set -g @floax-width '60%'
set -g @floax-height '60%'

run '~/.tmux/plugins/tpm/tpm'
